spring.application.name=members-management

spring.datasource.url=jdbc:h2:mem:membersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

app.security.username=admin
app.security.password=admin123
app.token.secret=dev-only-change-this-secret-before-production
app.token.salt=5c0744940b5c369b
app.token.expiration-minutes=120
